# Broken app "server-log-error" (see ../server.mjs): / makes the server write an error line to stderr.
version: 1
application:
  stack: node-express-spa
  build: []
  processes:
    - name: web
      command: [node, ../server.mjs, server-log-error]
      start_timeout_seconds: 20
      environment:
        PORT: "{port:web}"
        APP_PASSWORD: correct-horse
  base_url: web
  reset:
    strategy: none
testability:
  auth:
    type: none
  routes:
    public: [/]
