# Broken app "test-endpoint-in-production" (see ../server.mjs): /__test/reset still answers in Production.
version: 1
application:
  stack: node-express-spa
  build: []
  processes:
    - name: web
      command: [node, ../server.mjs, test-endpoint-in-production]
      start_timeout_seconds: 20
      environment:
        PORT: "{port:web}"
        APP_PASSWORD: correct-horse
  base_url: web
