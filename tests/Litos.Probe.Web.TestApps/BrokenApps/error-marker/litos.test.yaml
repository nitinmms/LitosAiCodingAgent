# Broken app "error-marker" (see ../server.mjs): / shows an error banner the contract declares in fail_on.
version: 1
application:
  stack: node-express-spa
  build: []
  processes:
    - name: web
      command: [node, ../server.mjs, error-marker]
      start_timeout_seconds: 20
      environment:
        PORT: "{port:web}"
        APP_PASSWORD: correct-horse
  base_url: web
  reset:
    strategy: none
testability:
  auth:
    type: none
  routes:
    public: [/]
  fail_on:
    - selector_visible: "#error-ui"
