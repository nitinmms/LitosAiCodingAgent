# Broken app "marker-missing" (see ../server.mjs): the contract's readiness marker never appears.
version: 1
application:
  stack: node-express-spa
  build: []
  processes:
    - name: web
      command: [node, ../server.mjs, healthy]
      start_timeout_seconds: 20
      environment:
        PORT: "{port:web}"
        APP_PASSWORD: correct-horse
  base_url: web
  reset:
    strategy: none
testability:
  ready:
    selector: "[data-testid=app-interactive]"
  auth:
    type: none
  routes:
    public: [/]
