# Broken app "crash-on-start" (see ../server.mjs): exits with code 3 at start.
version: 1
application:
  stack: node-express-spa
  build: []
  processes:
    - name: web
      command: [node, ../server.mjs, crash-on-start]
      start_timeout_seconds: 20
      environment:
        PORT: "{port:web}"
        APP_PASSWORD: correct-horse
  base_url: web
  reset:
    strategy: none
testability:
  auth:
    type: none
  routes:
    public: [/]
