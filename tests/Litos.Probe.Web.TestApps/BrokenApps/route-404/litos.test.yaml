# Broken app "route-404" (see ../server.mjs): the contract declares /missing, which the app does not have.
version: 1
application:
  stack: node-express-spa
  build: []
  processes:
    - name: web
      command: [node, ../server.mjs, healthy]
      start_timeout_seconds: 20
      environment:
        PORT: "{port:web}"
        APP_PASSWORD: correct-horse
  base_url: web
  reset:
    strategy: none
testability:
  auth:
    type: none
  routes:
    public: [/, /missing]
