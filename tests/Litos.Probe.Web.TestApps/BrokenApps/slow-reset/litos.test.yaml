# Broken app "slow-reset" (see ../server.mjs): its reset endpoint answers only after 12s, past the 10s HTTP timeout.
version: 1
application:
  stack: node-express-spa
  build: []
  processes:
    - name: web
      command: [node, ../server.mjs, slow-reset]
      start_timeout_seconds: 20
      environment:
        PORT: "{port:web}"
        APP_PASSWORD: correct-horse
  base_url: web
  reset:
    strategy: endpoint
    endpoint: POST /__test/reset
testability:
  auth:
    type: form
    login_url: /login
    fields: { user: Email, password: Password }
    submit: Log in
    success_when: { url_not_contains: /login }
    roles:
      admin: { user: admin@test, password: "{secret:BROKEN_ADMIN_PASS}" }
      user: { user: user@test, password: "{secret:BROKEN_USER_PASS}" }
  routes:
    public: [/]
    protected: { admin: [/admin] }
    denied: { user: [/admin] }
