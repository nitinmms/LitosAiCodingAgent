name: Release Litos.Console

# Triggered by pushing a tag like "console-v1.2.3" — separate from Litos.Gui's "v*.*.*" tags
# (release-gui.yml) so the two faces version and release independently. Publishes self-contained,
# single-file builds for win-x64, osx-arm64, osx-x64, and linux-x64, and attaches them (plus
# SHA256 checksums) to a GitHub Release for that tag.
on:
  push:
    tags:
      - "console-v*.*.*"

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish win-x64
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^console-v', ''
          dotnet publish src/Litos.Console/Litos.Console.csproj `
            -c Release -r win-x64 -o deploy/out/console/windows/win-x64 `
            --self-contained true -p:PublishSingleFile=true `
            -p:Version=$version -p:InformationalVersion=$version

      - name: Package release asset
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zipPath = "Litos.Console-$version-win-x64.zip"
          Compress-Archive -Path "deploy/out/console/windows/win-x64/Litos.Console.exe" -DestinationPath $zipPath
          (Get-FileHash -Algorithm SHA256 $zipPath).Hash | Out-File -Encoding ascii "$zipPath.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: console-windows
          path: |
            Litos.Console-*-win-x64.zip
            Litos.Console-*-win-x64.zip.sha256

  publish-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        runtime: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Import signing certificate
        if: ${{ env.APPLE_CERT_P12 != '' }}
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo -n "$APPLE_CERT_P12" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          rm -f "$CERT_PATH"

      - name: Publish (and sign/notarize if configured)
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_CERT_P12 != '' && format('Developer ID Application: Nitin Sharma ({0})', secrets.APPLE_TEAM_ID) || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          LITOS_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${LITOS_VERSION#console-v}"
          LITOS_VERSION="$VERSION" ./deploy/publish-console-macos.sh ${{ matrix.runtime }}

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Checksum
        run: shasum -a 256 "deploy/out/console/macos/${{ matrix.runtime }}/Litos.Console-${{ matrix.runtime }}.zip" | awk '{print $1}' > "deploy/out/console/macos/${{ matrix.runtime }}/Litos.Console-${{ matrix.runtime }}.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: console-${{ matrix.runtime }}
          path: |
            deploy/out/console/macos/${{ matrix.runtime }}/Litos.Console-${{ matrix.runtime }}.zip
            deploy/out/console/macos/${{ matrix.runtime }}/Litos.Console-${{ matrix.runtime }}.zip.sha256

  publish-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        env:
          LITOS_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${LITOS_VERSION#console-v}"
          LITOS_VERSION="$VERSION" ./deploy/publish-console-linux.sh ${{ matrix.runtime }}

      - name: Checksum
        run: |
          cd deploy/out/console/linux
          sha256sum "Litos.Console-${{ matrix.runtime }}.tar.gz" | awk '{print $1}' > "Litos.Console-${{ matrix.runtime }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: console-${{ matrix.runtime }}
          path: |
            deploy/out/console/linux/Litos.Console-${{ matrix.runtime }}.tar.gz
            deploy/out/console/linux/Litos.Console-${{ matrix.runtime }}.tar.gz.sha256

  release:
    needs: [publish-windows, publish-macos, publish-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
