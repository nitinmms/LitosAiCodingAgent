<!doctype html>
<!-- Standalone copy of the published prototype (see README.md). The published artifact serves the same content without these wrapper lines. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Litos Software Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a factory floor console. Top bar + three-pane thread view (line list / work order / gauges), a board of stations, and a walkthrough dock. */
:root{
  --bg:#E9ECEF; --surface:#FFFFFF; --surface-2:#F4F6F8; --ink:#16202A; --muted:#566371; --line:#D2D8DF;
  --petrol:#1D5C73; --petrol-soft:#DCEBF0; --amber:#B7700F; --amber-soft:#FBEBCF; --ok:#2B7A4B; --ok-soft:#DDF0E3;
  --bad:#B3261E; --bad-soft:#F8DEDC; --focus:#1D5C73;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif; --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r-sm:4px; --r-md:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161B; --surface:#192027; --surface-2:#1F2830; --ink:#E4E9EE; --muted:#97A3AF; --line:#2D3842;
  --petrol:#58A9C4; --petrol-soft:#1B3540; --amber:#E7AE4B; --amber-soft:#3A2D14; --ok:#63B884; --ok-soft:#18321F;
  --bad:#E46A60; --bad-soft:#3A1B19; --focus:#58A9C4; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161B; --surface:#192027; --surface-2:#1F2830; --ink:#E4E9EE; --muted:#97A3AF; --line:#2D3842;
  --petrol:#58A9C4; --petrol-soft:#1B3540; --amber:#E7AE4B; --amber-soft:#3A2D14; --ok:#63B884; --ok-soft:#18321F;
  --bad:#E46A60; --bad-soft:#3A1B19; --focus:#58A9C4; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
code,.mono{font-family:var(--f-code);font-size:.86em}
code{background:var(--surface-2);border:1px solid var(--line);border-radius:3px;padding:0 4px;overflow-wrap:anywhere}
h1,h2,h3{font-family:var(--f-display);font-stretch:112%;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.6rem;font-weight:750}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.num{font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:6px 12px;cursor:pointer;font-weight:600;font-size:.86rem;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--petrol);border-color:var(--petrol);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.attn{background:var(--amber);border-color:var(--amber);color:var(--surface)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:.76rem;font-weight:600;border:1px solid transparent;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.you{background:var(--amber-soft);color:var(--amber)}
.pill.agent{background:var(--petrol-soft);color:var(--petrol)}
.pill.waiting{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:3px;padding:0 6px;font-size:.74rem;color:var(--muted);font-weight:600}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding-block:8px;padding-inline:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-stretch:118%;font-weight:800;font-size:1.02rem;letter-spacing:.01em}
.brand svg{flex:none}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav button{border:0;background:transparent;padding:6px 10px;border-radius:var(--r-sm);cursor:pointer;font-weight:600;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--ink);background:var(--surface-2);box-shadow:inset 0 -2px 0 var(--petrol)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;background:var(--petrol-soft);color:var(--petrol);flex:none}
.userbox{display:flex;align-items:center;gap:8px}
.userbox select{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:4px 6px;max-width:190px}

/* page */
.page{padding-block:20px 140px;padding-inline:16px;max-width:1500px;margin:0 auto}

/* login */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);}
.login-art{background:var(--ink);color:var(--bg);padding:48px 40px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.login-art h1{font-size:clamp(2rem,4.5vw,3.4rem);font-stretch:125%;font-weight:800;line-height:1.02;max-width:12ch}
.login-art p{max-width:46ch;opacity:.8}
.login-line{display:flex;gap:0;align-items:center;flex-wrap:wrap}
.login-line span{font-family:var(--f-display);font-stretch:118%;font-weight:700;font-size:.85rem;padding:6px 12px;border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);margin-right:-1px}
.login-line span.on{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.login-form{display:grid;place-items:center;padding:40px 16px}
.login-form form{width:min(360px,100%);display:grid;gap:14px}
.field{display:grid;gap:4px}
.field label{font-weight:600;font-size:.86rem}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 10px;width:100%}
.field .hint{font-size:.78rem;color:var(--muted)}

/* board */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-block:14px 18px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;display:grid;gap:2px}
.metric b{font-family:var(--f-display);font-stretch:112%;font-size:1.5rem;font-weight:750;font-variant-numeric:tabular-nums}
.metric span{color:var(--muted);font-size:.8rem}
.metric.attn{border-color:var(--amber);box-shadow:inset 3px 0 0 var(--amber)}
.flow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;margin-bottom:18px;display:grid;gap:8px}
.flow-row{display:grid;grid-template-columns:110px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:.84rem}
.flow-bar{height:10px;background:var(--surface-2);border-radius:2px;position:relative;overflow:hidden}
.flow-bar i{position:absolute;inset:0 auto 0 0;background:var(--petrol);border-radius:2px}
.flow-bar i.human{background:var(--amber)}
.board-head{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:5px 8px}
.board-scroll{overflow-x:auto;padding-bottom:8px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:10px;min-width:min-content}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:220px}
.col-head{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-display);font-stretch:112%;font-weight:700}
.col-head small{font-family:var(--f-body);color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;display:grid;gap:7px;cursor:pointer;text-align:left}
.card:hover{border-color:var(--muted)}
.card.you{box-shadow:inset 3px 0 0 var(--amber)}
.card-title{font-weight:600;line-height:1.3}
.card-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.78rem;color:var(--muted)}
.minibar{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.minibar i{display:block;height:100%;background:var(--petrol)}
.empty-col{font-size:.8rem;color:var(--muted);padding:6px 2px}

/* thread view */
.tv{display:grid;grid-template-columns:250px minmax(0,1fr) 330px;gap:16px;align-items:start}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px;display:grid;gap:10px;position:sticky;top:64px}
.list-proj{display:grid;gap:4px}
.list-proj h3{font-size:.8rem;color:var(--muted);padding:2px 4px}
.list-item{display:grid;gap:3px;border:0;background:transparent;text-align:left;padding:7px 8px;border-radius:var(--r-sm);cursor:pointer}
.list-item:hover{background:var(--surface-2)}
.list-item[aria-current="true"]{background:var(--petrol-soft)}
.list-item span:first-child{font-weight:600;line-height:1.3}
.center{min-width:0;display:grid;gap:12px}
.th-head{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;display:grid;gap:12px}
.th-title{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.th-sub{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted);align-items:center}

/* the line: stage rail */
.rail{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));position:relative;padding-top:4px}
.rail::before{content:"";position:absolute;left:7%;right:7%;top:15px;height:4px;background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 14px)}
.st{display:grid;justify-items:center;gap:6px;position:relative;z-index:1;font-size:.74rem;color:var(--muted);text-align:center}
.st i{width:26px;height:26px;border-radius:5px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-style:normal;font-family:var(--f-display);font-weight:800;font-size:.72rem}
.st.done i{background:var(--petrol);border-color:var(--petrol);color:var(--surface)}
.st.done{color:var(--ink)}
.st.now i{border-color:var(--petrol);color:var(--petrol);background:var(--petrol-soft)}
.st.now{color:var(--ink);font-weight:700}
.st.now.you i{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.st.skip i{border-style:dashed}
.st.now.moving i{animation:carrier 1.2s ease-in-out infinite}
@keyframes carrier{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.st.now.moving i{animation:none}}

/* conversation */
.convo{display:grid;gap:10px}
.m{display:grid;gap:4px;max-width:760px}
.m-who{font-size:.78rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.m-who b{color:var(--ink)}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;overflow-wrap:anywhere}
.m.user .bubble{background:var(--petrol-soft);border-color:transparent}
.mention{font-weight:700;color:var(--petrol)}
.ev{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:8px;align-items:start;font-size:.86rem;padding:2px 4px;color:var(--ink)}
.ev::before{content:"";width:8px;height:8px;margin-top:7px;border-radius:2px;background:var(--petrol);justify-self:center}
.ev.ok::before{background:var(--ok)} .ev.bad::before{background:var(--bad)} .ev.sys::before{background:var(--muted)}
.ev .tok{font-size:.74rem;color:var(--muted);white-space:nowrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;display:grid;gap:10px;max-width:760px}
.panel.you{border-color:var(--amber);box-shadow:inset 4px 0 0 var(--amber)}
.panel.okp{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.panel-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.panel ol,.panel ul{margin:0;padding-left:20px;display:grid;gap:4px}
.kv{display:grid;grid-template-columns:minmax(120px,max-content) minmax(0,1fr);gap:4px 14px;font-size:.86rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted)}
.check{display:flex;gap:8px;align-items:flex-start}
.check input{margin-top:4px;accent-color:var(--petrol)}
.diff{font-family:var(--f-code);font-size:.78rem;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px;overflow-x:auto;white-space:pre;margin:0}
.diff .a{color:var(--ok)} .diff .d{color:var(--bad)}
.opts{display:grid;gap:8px}
.opt{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;background:var(--surface);text-align:left;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.opt:hover{border-color:var(--petrol)}
.opt.chosen{border-color:var(--petrol);background:var(--petrol-soft)}

/* composer */
.composer{position:sticky;bottom:env(safe-area-inset-bottom,0px);background:var(--bg);padding-block:8px;display:grid;gap:6px;z-index:5}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.compose-box{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:8px}
.compose-box textarea{border:0;background:transparent;resize:none;min-height:40px;max-height:160px;padding:6px 4px;outline:none;width:100%}
.compose-box:focus-within{border-color:var(--petrol)}
.compose-hint{font-size:.76rem;color:var(--muted)}

/* details */
.details{display:grid;gap:12px;position:sticky;top:64px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;display:grid;gap:8px}
.box h3{font-size:.86rem}
.gauge{height:12px;border-radius:2px;background:var(--surface-2);overflow:hidden;display:flex;border:1px solid var(--line)}
.gauge i{display:block;height:100%}
.gauge .u{background:var(--petrol)} .gauge .d{background:color-mix(in srgb,var(--petrol) 35%,transparent)}
.ledger{display:grid;gap:3px;font-size:.76rem}
.ledger div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.ledger span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow{display:flex;justify-content:space-between;gap:8px;font-size:.84rem;align-items:center}
.files{display:grid;gap:3px;font-size:.78rem}
.files div{display:flex;justify-content:space-between;gap:8px}
.files .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.plus{color:var(--ok)} .minus{color:var(--bad)}

/* admin + lessons */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start}
.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;display:grid;gap:12px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.toggle{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.switch{position:relative;width:38px;height:22px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer;position:absolute;inset:0;z-index:1}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch input:checked+span{background:var(--petrol)}
.switch input:checked+span::after{transform:translateX(16px)}
.switch input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.lesson{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;display:grid;gap:6px}
.subnav{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);padding-bottom:6px}
.subnav button{border:1px solid transparent;background:transparent;padding:6px 10px;border-radius:var(--r-sm);cursor:pointer;font-weight:600;color:var(--muted)}
.subnav button:hover{background:var(--surface-2)}
.subnav button[aria-current="page"]{color:var(--ink);border-color:var(--line);background:var(--surface)}
.inline-input{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:5px 8px;min-width:0;width:100%;max-width:340px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn.small{padding:2px 8px;font-size:.78rem}
.warn{color:var(--amber);font-weight:600}
table.models td{vertical-align:middle}
.row-actions{text-align:right;white-space:nowrap}
.modal.wide{width:min(860px,100%)}
.picker-filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vt{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.vt-row{display:grid;grid-template-columns:32px minmax(0,1fr) 80px 56px 150px;gap:8px;align-items:center;padding:0 10px;font-size:.84rem;border-bottom:1px solid var(--line);cursor:pointer;background:var(--surface)}
.vt-row.sel{background:var(--petrol-soft)}
.vt-head{background:var(--surface-2);font-weight:600;color:var(--muted);height:34px;cursor:default}
.vt-body{overflow-y:auto;position:relative}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sort{border:0;background:transparent;padding:0;font:inherit;color:inherit;cursor:pointer;font-weight:600}
.combo{position:relative}
.combo-btn{width:100%;display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 10px;cursor:pointer;text-align:left}
.combo-pop{position:absolute;z-index:70;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--muted);border-radius:var(--r-sm);padding:8px;display:grid;gap:6px;box-shadow:0 8px 24px color-mix(in srgb,var(--ink) 18%,transparent)}
.combo-list{max-height:260px;overflow:auto;display:grid}
.combo-group{font-size:.76rem;font-weight:700;color:var(--muted);padding:6px 6px 2px}
.combo-opt{border:0;background:transparent;text-align:left;padding:6px 8px;border-radius:3px;cursor:pointer;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.combo-opt:hover,.combo-opt.on{background:var(--petrol-soft)}
@media (max-width:760px){.vt-row{grid-template-columns:28px minmax(0,1fr) 56px 44px}.vt-row .price{display:none}}

/* walkthrough dock */
.tour{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100% - 32px));background:var(--surface);border:1px solid var(--ink);border-radius:var(--r-md);box-shadow:0 10px 30px color-mix(in srgb,var(--ink) 22%,transparent);z-index:40;display:grid}
.tour-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:var(--ink);color:var(--bg);border-radius:7px 7px 0 0;cursor:pointer;border:0;width:100%;text-align:left}
.tour-head b{font-family:var(--f-display);font-stretch:115%}
.tour-body{padding:12px;display:grid;gap:10px;max-height:min(62vh,520px);overflow:auto}
.tour-step h3{font-size:1rem}
.tour-list{display:grid;gap:2px;font-size:.8rem;list-style:none;margin:0;padding:0}
.tour-list li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:6px;color:var(--muted)}
.tour-list li.done{color:var(--ink)}
.tour-list li.cur{color:var(--ink);font-weight:700}
.tour-list li i{font-style:normal;font-variant-numeric:tabular-nums}

  for(const t of queued){
    const holder=s.threads.find(x=>x.id!==t.id&&x.projectId===t.projectId&&x.holdsLock);
    if(holder){t.waitingFor={title:holder.title,state:stateName(holder)};continue;}
    if(running>=s.slots){t.waitingFor={slots:true};continue;}
    running++; t.waitingFor=null; t.state='Running'; t.holdsLock=true;
    const p=proj(s,t.projectId);
    if(!t.branch){t.branch='factory/'+t.hex+'-'+slug(t.title);msg(s,t,{kind:'event',text:'Repository acquired. Created branch `'+t.branch+'` from `'+p.branch+'`.'});}

        if(t.chatPending.length){const r=t.chatPending.shift();t.discussion+=r.tokens;msg(s,t,{kind:'litos',text:r.text,tokens:r.tokens});}
        else if(t.state==='Running') stepThread(s,t);
      }
      schedule(s);
      return s;}
  }
  return s;
}
function answer(s,t,text,user){
  const m=[...t.messages].reverse().find(x=>x.kind==='decision'&&!x.answer);
  if(m){m.answer=text;m.answeredBy=user;}
  t.decision=null;t.decisionAnswered=true;t.state='Running';
  msg(s,t,{kind:'event',tone:'sys',text:'Decision recorded in the task spec. Resuming the run.'});
}

function Mark(){return html`<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="4" fill="var(--ink)"/><path d="M5 17h16" stroke="var(--bg)" strokeWidth="2" strokeDasharray="3 2"/><rect x="7" y="8" width="5" height="6" rx="1" fill="var(--amber)"/><rect x="14" y="8" width="5" height="6" rx="1" fill="var(--bg)"/></svg>`;}

function Rail({t}){

/* Searchable model picker: grouped by provider, optional pinned sections (default, recently used). */
function ModelCombo({id,label,choices,value,onChange,pinned}){
  const [open,setOpen]=useState(false);const [q,setQ]=useState('');
  const cur=choices.find(c=>c.value===value);
  const ql=q.trim().toLowerCase();
  const hits=choices.filter(c=>!ql||(c.group+' '+c.label).toLowerCase().includes(ql));
  const sections=[];
  if(!ql&&pinned) for(const p of pinned){const vs=p.values.map(v=>choices.find(c=>c.value===v)).filter(Boolean);if(vs.length)sections.push({title:p.title,items:vs});}
  const groups=[...new Set(hits.map(c=>c.group))];
  for(const g of groups) sections.push({title:g,items:hits.filter(c=>c.group===g)});
  const pick=v=>{onChange(v);setOpen(false);setQ('');};
  return html`<div className="combo" onKeyDown=${e=>{if(e.key==='Escape'){setOpen(false);}}}>
    <button type="button" id=${id} className="combo-btn" aria-haspopup="listbox" aria-expanded=${open} aria-label=${label+': '+(cur?cur.group+' '+cur.label:'none selected')} onClick=${()=>setOpen(!open)}>
      <span>${cur?html`${cur.group} <span className="mono">${cur.label}</span>`:'Choose a model'}</span><span aria-hidden="true">▾</span></button>
    ${open?html`<div className="combo-pop">
      <input className="inline-input" style=${{maxWidth:'none'}} autoFocus placeholder="Search models" aria-label="Search models" value=${q} onChange=${e=>setQ(e.target.value)}/>
      <div className="combo-list" role="listbox" aria-label=${label}>
        ${sections.length?sections.map((s,i)=>html`<div key=${s.title+i}><div className="combo-group">${s.title}</div>
          ${s.items.map(c=>html`<button type="button" role="option" aria-selected=${c.value===value} key=${s.title+c.value} className=${'combo-opt'+(c.value===value?' on':'')} onClick=${()=>pick(c.value)}>
            <span className="mono">${c.label}</span>${s.title!==c.group?html`<span className="small muted">${c.group}</span>`:null}${c.note?html`<span className="small muted">${c.note}</span>`:null}</button>`)}</div>`)
        :html`<p className="small muted" style=${{padding:'8px'}}>No allowed model matches “${q}”.</p>`}
      </div></div>`:null}
  </div>`;
}

function Tour({S,dispatch}){
  const list=steps(S);const cur=list.findIndex(x=>!x.done);const all=cur===-1;
  const st=all?null:list[cur];
  const open=S.tourOpen;
  const runAct=()=>{for(const a of st.act) dispatch(a);};
  const canAct=st&&st.act.length>0&&st.can!==false;
  return html`<aside className="tour" aria-label="Walkthrough">
    <button className="tour-head" onClick=${()=>dispatch({type:'TOUR',open:!open})} aria-expanded=${open}>
      <b>${all?'Walkthrough complete':'Walkthrough, step '+(cur+1)+' of '+list.length}</b><span className="small">${open?'Hide':'Show'}</span></button>
    ${open?html`<div className="tour-body">
      ${all?html`<div className="tour-step"><h3>You have seen the whole loop</h3><p className="small">Delegation, a decision, verification with evidence, rework, a budget pause, acceptance and a lesson. Explore freely, or reset to start again.</p></div>`
      :html`<div className="tour-step" style=${{display:'grid',gap:'8px'}}><h3>${st.title}</h3><p className="small">${st.body}</p>
        <div className="btn-row"><button className="btn primary" disabled=${!canAct} onClick=${runAct}>${st.actLabel||'Do this for me'}</button>
        ${st.wait&&!canAct?html`<span className="small muted">Waiting for the factory\u2026</span>`:null}</div>
        <p className="small muted">Or do it yourself in the page. The step completes either way.</p></div>`}
      <ol className="tour-list">${list.map((x,i)=>html`<li key=${i} className=${x.done?'done':i===cur?'cur':''}><i>${x.done?'\u2713':i+1}</i><span>${x.title}</span></li>`)}</ol>
      <div className="tour-foot">
        <label className="check small"><input id="fast" type="checkbox" checked=${S.speed==='fast'} onChange=${e=>dispatch({type:'SPEED',speed:e.target.checked?'fast':'normal'})}/> Fast simulation</label>
        <button className="btn ghost" onClick=${()=>dispatch({type:'RESET'})}>Reset prototype</button>
      </div>
    </div>`:null}
  </aside>`;
}
function Toast({S,dispatch}){

  useEffect(()=>{if(S.screen!=='app')return;const h=setInterval(()=>dispatch({type:'TICK'}),S.speed==='fast'?450:1300);return ()=>clearInterval(h);},[S.screen,S.speed]);
  if(S.screen==='login') return html`<${React.Fragment}><${Login} dispatch=${dispatch}/><${Tour} S=${S} dispatch=${dispatch}/><${Toast} S=${S} dispatch=${dispatch}/><//>`;
  const V={board:Board,thread:Threads,lessons:Lessons,admin:Admin}[S.view]||Board;
  return html`<${React.Fragment}>
    <${TopBar} S=${S} dispatch=${dispatch}/>
    <main><${V} S=${S} dispatch=${dispatch}/></main>
    <p className="note" style=${{paddingInline:'16px',paddingBottom:'120px'}}>Prototype of Litos Software Factory V1 with example data. It simulates the agent, GitHub and the database.</p>
    <${Tour} S=${S} dispatch=${dispatch}/><${Toast} S=${S} dispatch=${dispatch}/>
  <//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
window.__factoryTest={reducer,initialState,steps};
})();
</script>
